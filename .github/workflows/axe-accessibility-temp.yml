name: Explorer accessibility diagnostic (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6e4c5b75aa1b3b94b3da70d56c41c534116ac547
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Build fixed first-party GUI
        run: |
          test "$(git rev-parse HEAD)" = "6e4c5b75aa1b3b94b3da70d56c41c534116ac547"
          npm ci --no-audit
          npm run build
          npm test
      - name: Install diagnostic tools without changing the app lock
        run: |
          npm install --prefix .a11y-tools --ignore-scripts --no-audit --save-exact playwright@1.56.1 axe-core@4.13.0
          node .a11y-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run WCAG A and AA diagnostic checks on mock browser UI
        env:
          PW_MODULE: ${{ github.workspace }}/.a11y-tools/node_modules/playwright
          AXE_SCRIPT: ${{ github.workspace }}/.a11y-tools/node_modules/axe-core/axe.min.js
        run: |
          timeout 180 node tools/diagnostics/axe-certificate-review.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: explorer-a11y-diagnostic
          path: a11y-report/
          if-no-files-found: error
          retention-days: 14
