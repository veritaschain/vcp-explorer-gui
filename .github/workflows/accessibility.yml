name: Explorer accessibility regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Build first-party demo GUI
        run: |
          npm ci --no-audit
          npm run build
          npm test
      - name: Install isolated browser and axe-core tools
        run: |
          npm install --prefix .a11y-tools --ignore-scripts --no-audit --save-exact playwright@1.56.1 axe-core@4.13.0
          node .a11y-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check bounded WCAG rules for demo dashboard and certificate
        env:
          PW_MODULE: ${{ github.workspace }}/.a11y-tools/node_modules/playwright
          AXE_SCRIPT: ${{ github.workspace }}/.a11y-tools/node_modules/axe-core/axe.min.js
        run: |
          timeout 180 node tools/tests/check-accessibility.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: explorer-accessibility-evidence
          path: a11y-report/
          if-no-files-found: warn
          retention-days: 14
