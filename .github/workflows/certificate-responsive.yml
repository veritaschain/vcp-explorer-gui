name: Certificate responsive browser regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  responsive:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Build GUI with pinned project lock
        run: |
          npm ci --no-audit
          npm run build
          npm test
      - name: Install test-only Playwright and selected browser
        run: |
          npm install --prefix .browser-tools --ignore-scripts --no-audit --save-exact playwright@1.56.1
          node .browser-tools/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}
      - name: Check cross-browser viewports, navigation, disclaimer and print contrast
        env:
          PW_MODULE: ${{ github.workspace }}/.browser-tools/node_modules/playwright
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          timeout 180 node tools/tests/check-responsive.cjs
      - name: Inspect actual A4 PDF pages and render previews
        if: matrix.browser == 'chromium'
        run: |
          python3 -m venv .pdf-tools
          .pdf-tools/bin/pip install --disable-pip-version-check --no-input pymupdf==1.26.1
          .pdf-tools/bin/python tools/tests/check-print-pdf.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: certificate-ui-evidence-${{ matrix.browser }}
          path: ui-evidence/
          if-no-files-found: warn
          retention-days: 14
